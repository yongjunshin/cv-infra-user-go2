# policy_meta.yaml — the contract of the policy sitting next to it (policy.pt).
#
# WHY THIS FILE EXISTS, AND WHY IT IS HERE AND NOT IN sim/patrol_world.py.
# The numbers below are TRAINING artefacts: they describe the plant the network
# was trained against, so they change the moment the policy is retrained — a new
# action scale, different PD gains, a different control rate, a different stance,
# a different observation. The weights and these numbers are therefore ONE
# shipment, and they live in one directory: swap policy.pt without swapping this
# file and the robot is being driven by a plant the network has never seen, which
# does not raise anything — it just walks badly.
#
# PROVENANCE OF THE WEIGHTS NEXT TO THIS FILE (policy.pt) — swapped 2026-09-02.
#   experiment  unitree_go2_robust_creep — IsaacLab + rsl_rl PPO. Blind (no height
#               scan) rough-terrain curriculum (flat / random_rough / pyramid slopes
#               ...) with domain randomization (ground friction, base mass, base COM,
#               external pushes) and a custom velocity command that dedicates 10 %
#               of the envs to CREEPING (|v| <= 0.3 m/s) and 15 % to in-place
#               SPINNING (0.3-1.0 rad/s) — the two regimes the previous flat policy
#               executed at 5-23 % / ~6 % (README "보행 정책의 성격").
#   run         etri6000:/home/etri/dev/VLA-WS/checkpoints/logs/rsl_rl/
#               unitree_go2_robust_creep/2026-09-02_11-01-41 (resumed from
#               2026-09-02_09-05-23 @ model_2999; only delta between the two runs'
#               env.yaml: creep range 0.5 -> 0.3 m/s)
#   checkpoint  model_5200.pt -> exported/policy.pt (TorchScript, actor only:
#               MLP 48 -> 512 -> 256 -> 128 -> 12, ELU, no observation normalization)
#   sha256      ca4f184c79594359811a76d7e1a97979976e5c993f658ce34e6677dafa818650
#               (775,442 bytes; replaces checkpoints/go2_flat_pretrained/exported/
#               policy.pt 73338e49…, 174,184 bytes)
#   Every value below was re-derived from that run's params/env.yaml and is
#   UNCHANGED from the previous policy: the same 7 observation terms in the same
#   order (48-D, scale/clip none), JointPositionAction scale 0.25 on the default
#   offsets, sim dt 0.005 x decimation 4, DCMotor stiffness 25 / damping 0.5 /
#   effort 23.5 / velocity 30 / saturation 23.5, and the same default stance.
#
# sim/patrol_world.py holds the other half of the split: HARDWARE-TWIN constants
# (the robot USD, the spawn height, the joint order, the motor's torque/speed
# limits, the sensor mounts and optics, the publish rates). Those describe the
# robot and its instruments and only change when the ROBOT changes, so they do
# not belong next to a set of weights.
#
# The harness reads this file from the directory of whatever --policy points at,
# validates that every key below is present, and refuses to run if `obs_layout`
# is not the one layout it implements.

# Name of the observation the network expects. The harness assembles exactly one
# layout and compares this string against it — a retrain that reorders a term or
# adds one (a height scan, say) must mint a NEW name here, so that an old harness
# refuses the new policy instead of feeding it 48 numbers in the wrong order.
#   go2_flat_obs48_v1 = 48-D, no normalization, no noise, no clipping:
#     [ 0: 3] base linear velocity  (body frame)
#     [ 3: 6] base angular velocity (body frame)
#     [ 6: 9] gravity direction     (body frame, unit vector)
#     [ 9:12] velocity command (vx, vy, wz) — /cmd_vel, verbatim
#     [12:24] joint positions minus default_joint_pos
#     [24:36] joint velocities
#     [36:48] the previous step's RAW network output (pre-scale); zeros at reset
obs_layout: go2_flat_obs48_v1

# Physics steps per policy step. The harness runs physics at 200 Hz, so 4 makes
# the control rate 50 Hz — the rate the network was trained at. The motor torque
# is still recomputed EVERY physics step; only the network forward is decimated.
decimation: 4

# Joint position target = default_joint_pos + action_scale * raw_network_output.
# No clipping on the output, by training design.
action_scale: 0.25

# PD gains of the actuator model, N·m/rad and N·m·s/rad. They are the POLICY's
# gains, not the simulator's: the harness zeroes the simulator's own drive gains
# and applies the torque these produce as joint efforts, clamped by the motor's
# (hardware) torque/speed curve.
kp: 25.0
kd: 0.5

# Default stance, radians — the offset the action is added to, and the reference
# the observation's joint positions are measured against.
# A MAPPING, not a list: the ordering of the action vector is the harness's
# constant (hips, then thighs, then calves; FL, FR, RL, RR within each), and a
# bare list is the thing that quietly gets edited into the wrong order by someone
# who cannot see that constant. Named joints cannot be misordered.
default_joint_pos:
  FL_hip_joint: 0.1     # hips: left +0.1, right -0.1
  FR_hip_joint: -0.1
  RL_hip_joint: 0.1
  RR_hip_joint: -0.1
  FL_thigh_joint: 0.8   # thighs: front 0.8, rear 1.0
  FR_thigh_joint: 0.8
  RL_thigh_joint: 1.0
  RR_thigh_joint: 1.0
  FL_calf_joint: -1.5   # calves: all -1.5
  FR_calf_joint: -1.5
  RL_calf_joint: -1.5
  RR_calf_joint: -1.5
