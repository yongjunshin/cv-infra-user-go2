# nav2_params.yaml — Nav2 parameters for the Go2 patrol app.
#
# PROVENANCE (no invented values). This file is the UPSTREAM STOCK Nav2 parameter set,
# copied verbatim and then edited in the places listed below — each one carrying the
# measurement it came from.
#   source file : /opt/ros/jazzy/share/nav2_bringup/params/nav2_params.yaml
#   source deb  : ros-jazzy-nav2-bringup 1.3.12-1noble.20260616.082701
#                 (the version this repo's robot_sw/Dockerfile pins)
#   extracted   : 2026-09-01, from the image built on base digest
#                 ros:jazzy-ros-base-noble@sha256:31daab66…
#   stock sha256: 299f9002d6dcfbf661e532c99f32dda1766eab3afa3ab71a52378d80e7ef956f
#
# DELTA TABLE vs stock. Every row cites the MEASUREMENT it comes from; nothing here
# is a preference. Search for "go2 DELTA" to find each edit in place.
#
#  # | where                                   | stock -> ours                | why (source)
#  1 | local+global_costmap                    | robot_radius 0.22 -> footprint
#    |                                         | 0.70 x 0.31 m rectangle      | Go2 body box (published size). Still a STARTING POINT, not a measurement.
#  2 | amcl.base_frame_id                      | base_footprint -> base_link  | the sim publishes odom->base_link and NOTHING publishes base_footprint (tf measured). Upstream carter_navigation also uses base_link on this map.
#  3 | collision_monitor.base_frame_id         | base_footprint -> base_link  | same frame, same reason. A collision monitor that cannot transform its base frame stops passing commands at all — silent immobility.
#  4 | amcl.max_beams                          | 60 -> 360                    | upstream carter_navigation params for THIS warehouse/map use 360; our scan carries 3200 beams (measured).
#  5 | amcl.set_initial_pose / initial_pose    | (absent) -> true / SETTLED pose | nothing publishes /initialpose in a plain run, so without this the filter has to global-localise first. Upstream carter_navigation self-seeds the same way for the same reason. The VALUE is the pose the robot settles at after the policy's ~0.97 m activation transient (measured live), not the declared spawn — see the block itself.
#  6 | FollowPath(MPPI).wz_max                 | 1.9 -> 0.8                   | the policy tracks 0.730 rad/s of a commanded 0.8 while walking (91 %) — beyond that nothing is measured, and an untracked command makes MPPI's own model wrong. Upstream carter uses 0.7 rad/s here.
#  7 | velocity_smoother.max/min_velocity[2]   | +-2.0 -> +-0.8               | same ceiling at the last shaping stage: nav2 remaps controller AND behavior cmd_vel to cmd_vel_nav -> velocity_smoother -> collision_monitor (verified in the pinned nav2_bringup navigation_launch.py), so this one number caps every autonomy source.
#  8 | general_goal_checker.yaw_goal_tolerance | 0.25 -> 3.15 (> pi)          | orientation-free goal. In-place yaw runs at 6 % of command (measured), so a final-heading requirement is one this policy cannot satisfy, and this app's missions do not need one.
#  9 | bt_navigator.default_nav_to_pose_bt_xml | (absent) -> our no-spin tree | same measurement — see behavior_trees/navigate_to_pose_no_spin.xml, which is the stock tree with the `<Spin>` recovery line deleted and nothing else.
# 10 | scan sources (both costmaps)            | (absent) -> min_obstacle_height 0.15 | the scan plane sits 0.43 m above the floor, so body pitch puts FLOOR returns in the scan (~4.3 m ahead at 0.1 rad). Height-filtering them is this app's job. 0.15 m is the threshold stock already uses for the same purpose in collision_monitor's scan source (below).
# 11 | general_goal_checker.xy_goal_tolerance  | 0.25 -> 0.50                 | live measurement: this policy does not execute the creep commands MPPI issues inside 0.4 m (0.035 m/s -> 4.6 % of it), so a 0.25 m checker never fires and the recovery ladder runs forever. Full sweep + belief-error numbers at the parameter.
# 12 | collision_monitor.cmd_vel_out_topic     | cmd_vel -> cmd_vel_autonomy  | twist_mux owns /cmd_vel now and arbitrates this stack against teleop (../params/twist_mux.yaml). NOT cmd_vel_nav: nav2_bringup remaps velocity_smoother's INPUT to that name (verified in the pinned deb, composed and plain), so publishing the gate's output there is a feedback loop.
#
# EXPLICITLY NOT CHANGED (recorded so the next reader does not "fix" them blindly):
#   - controller `FollowPath` = MPPI with `motion_model: "DiffDrive"`, vy unused.
#     Treating the quadruped as diff-drive is already the stock behaviour even though
#     the policy CAN strafe (0.49 of a commanded 0.5 m/s, measured control arm).
#   - `FollowPath.vx_max: 0.5` is KEPT: that is the exact command measured being tracked
#     at 99 % (0.4957 m/s over 5.95 m), i.e. it is already inside the conservative band.
#     Lowering a measured-good number would be invention.
#   - NO RotationShimController is added (a common quadruped/nav2 recipe): it exists
#     to rotate in place toward the path heading, which is precisely the 6 % motion.
#     Missions here start the robot facing the goal instead.
#   - costmap sizes, inflation, plugin lists, planner, smoother: stock. Tune on live
#     evidence only.
#   - `enable_stamped_cmd_vel` is not set anywhere in stock (code default applies), so
#     everything on this path is plain geometry_msgs/Twist. That is what makes
#     `use_stamped: false` load-bearing in ../params/twist_mux.yaml — read that file
#     before changing either side.
#   - `loopback_simulator.base_frame_id` stays `base_footprint`: that node is never
#     launched here (it is nav2's own no-sim test harness).
amcl:
  ros__parameters:
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    # go2 DELTA 2 (see header): stock "base_footprint" -> "base_link".
    # The simulator publishes exactly one moving transform, `odom -> base_link`
    # (measured on the wire: `tf2_echo odom base_link` answers,
    # base_footprint does not exist anywhere in the TF tree). AMCL with a base
    # frame nobody publishes never localises and never says why.
    base_frame_id: "base_link"
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    global_frame_id: "map"
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    laser_max_range: 100.0
    laser_min_range: -1.0
    laser_model_type: "likelihood_field"
    # go2 DELTA 4 (see header): stock 60 -> 360, the value upstream
    # carter_navigation uses for THIS warehouse + THIS map (same commit the map in
    # ../maps/ was vendored from). Our scan carries 3200 beams (measured),
    # so 60 of them is a thin slice of the evidence available; AMCL only updates
    # every update_min_d 0.25 m, so the extra beams are affordable.
    max_beams: 360
    max_particles: 2000
    min_particles: 500
    odom_frame_id: "odom"
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 1
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    save_pose_rate: 0.5
    sigma_hit: 0.2
    tf_broadcast: true
    transform_tolerance: 1.0
    update_min_a: 0.2
    update_min_d: 0.25
    z_hit: 0.5
    z_max: 0.05
    z_rand: 0.5
    z_short: 0.05
    scan_topic: scan
    # go2 DELTA 5 (see header): self-seed the particle filter.
    # Nothing publishes /initialpose in a plain run of this app, so without this block
    # the mission starts with a uniform-ish prior and has to global-localise before it
    # can plan. Upstream carter_navigation's params solve it the same way on this same
    # map (`set_initial_pose: true` + `initial_pose: {x: -6.0, y: -1.0, yaw: 3.14159}`)
    # — we differ only in yaw.
    # VALUE = where the robot ACTUALLY STANDS once it is up, which is NOT where it was
    # spawned (-6.0, -1.0, pi/2). The locomotion policy's activation transient walks the
    # body ~0.97 m along its heading before it settles (measured 0.9436 m at yaw 0;
    # 0.968 m at yaw pi/2 on the live sim: spawned (-6.0,-1.0) -> settled
    # (-6.051,-0.032), yaw 1.564).
    #
    # WHY THAT MATTERS (measured live): the transient happens BEFORE amcl is even up, so
    # amcl sees no odom motion afterwards, never triggers a filter update
    # (update_min_d 0.25 m), and starts the mission believing it is a metre behind
    # itself. nav2 logged `Begin navigating from current location (-6.00, -1.00)` while
    # ground truth was (-6.05, -0.03). The mission still SUCCEEDED and ground truth
    # passed within 0.020 m of the goal, but the stack then spent ~75 s of sim time and
    # 6 recovery rounds closing a gap that was never real.
    #
    # ⚠ ANYONE PUBLISHING /initialpose OVERRIDES THIS. Seed the SETTLED pose, not the
    # spawn pose, or the same ~0.97 m offset comes straight back.
    set_initial_pose: true
    initial_pose:
      x: -6.051
      y: -0.032
      z: 0.0
      yaw: 1.564

bt_navigator:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    action_server_result_timeout: 900.0
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"
    # 'default_nav_through_poses_bt_xml' is left at its default:
    # nav2_bt_navigator/navigate_through_poses_w_replanning_and_recovery.xml
    # (this app drives NavigateToPose only.)
    #
    # go2 DELTA 9 (see header): the navigate-to-pose tree is OURS — the stock tree
    # with the `<Spin spin_dist="1.57">` recovery deleted, because in-place yaw runs
    # at 6 % of command on this locomotion policy (measured). The file documents the
    # deletion and pins the stock sha256.
    #
    # `$(find-pkg-share ...)` resolves at launch time: nav2_bringup loads this file
    # through ParameterFile(..., allow_substs=True) (verified in the pinned deb), so
    # ONE spelling works both inside the image (/opt/go2_ws/install/...) and in a
    # plain local `colcon build` overlay — which is what keeps the local dev loop
    # working without a second params file.
    default_nav_to_pose_bt_xml: "$(find-pkg-share go2_bringup)/behavior_trees/navigate_to_pose_no_spin.xml"

    # plugin_lib_names is used to add custom BT plugins to the executor (vector of strings).
    # Built-in plugins are added automatically
    # plugin_lib_names: []

    error_code_names:
      - compute_path_error_code
      - follow_path_error_code

controller_server:
  ros__parameters:
    controller_frequency: 20.0
    costmap_update_timeout: 0.30
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"] # "precise_goal_checker"
    controller_plugins: ["FollowPath"]
    use_realtime_priority: false

    # Progress checker parameters
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0
    # Goal checker parameters
    #precise_goal_checker:
    #  plugin: "nav2_controller::SimpleGoalChecker"
    #  xy_goal_tolerance: 0.25
    #  yaw_goal_tolerance: 0.25
    #  stateful: True
    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      # go2 DELTA 11 (see header): stock 0.25 -> 0.50 m. MEASURED live — this is
      # the tolerance that makes the difference between "the mission ends" and "the
      # mission thrashes until timeout":
      #   * the robot passed within 0.018 m of the goal (ground truth) …
      #   * … while amcl believed it was 0.402 m away (belief (-6.276, 4.708) vs GT
      #     (-5.938, 4.896) at the same instant = 0.387 m of belief error), so a 0.25 m
      #     checker never fired, and
      #   * MPPI then throttled to vx = 0.035 m/s to close a gap that was not there —
      #     a command THIS LOCOMOTION POLICY DOES NOT EXECUTE. Measured sweep on the
      #     live sim (constant /cmd_vel, 10 s sim per leg, ground-truth displacement):
      #       cmd 0.000 -> 0.0005 m/s   cmd 0.035 -> 4.6 %   cmd 0.05 -> 5.8 %
      #       cmd 0.100 -> 22.7 %       cmd 0.150 -> 16.6 %  cmd 0.20 -> 48.6 %
      #       cmd 0.300 -> 74.6 %       (C2b measured cmd 0.5 -> 99 % in a clear lane)
      #     i.e. below ~0.2 m/s the gait produces almost no translation. The robot then
      #     stands still, the progress checker fails every 10 s, and the recovery ladder
      #     runs forever. Six such rounds were logged before the goal finally completed.
      # 0.50 m is the smallest round number that is >= both the measured belief error
      # (0.387 m) and the believed distance at which MPPI enters that dead zone (0.4 m).
      xy_goal_tolerance: 0.5
      # go2 DELTA 8 (see header): > pi = "any final heading satisfies this goal".
      # This app's missions have no final-heading requirement — the patrol manager gets
      # its arrival heading out of the DRIVE, not out of the goal checker — and this
      # policy's in-place yaw is 6 % of command (measured), so a 0.25 rad final
      # alignment would spend the whole mission budget rotating AFTER arriving.
      # pi is the largest possible yaw error, so 3.15 is exact, not arbitrary.
      yaw_goal_tolerance: 3.15
    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"
      time_steps: 56
      model_dt: 0.05
      batch_size: 2000
      ax_max: 3.0
      ax_min: -3.0
      ay_max: 3.0
      ay_min: -3.0
      az_max: 3.5
      vx_std: 0.2
      vy_std: 0.2
      wz_std: 0.4
      # vx_max KEPT at stock 0.5: C2b measured this exact command tracked at 99 %
      # (5.9491 m in 12.005 s = 0.4957 m/s, tipped 0, collisions 0).
      vx_max: 0.5
      vx_min: -0.35
      vy_max: 0.5
      # go2 DELTA 6 (see header): stock 1.9 -> 0.8 rad/s. Measured tracking while
      # walking: 0.730 rad/s for a commanded 0.8 (91 %, measured). Nothing above 0.8
      # has been measured, and MPPI scores trajectories with a model that assumes the
      # command is executed — so an unreachable wz_max makes it prefer turns the robot
      # cannot make. Upstream carter_navigation caps this warehouse at 0.7 rad/s.
      wz_max: 0.8
      iteration_count: 1
      prune_distance: 1.7
      transform_tolerance: 0.1
      temperature: 0.3
      gamma: 0.015
      motion_model: "DiffDrive"
      visualize: true
      regenerate_noises: true
      TrajectoryVisualizer:
        trajectory_step: 5
        time_step: 3
      AckermannConstraints:
        min_turning_r: 0.2
      critics: [
        "ConstraintCritic", "CostCritic", "GoalCritic",
        "GoalAngleCritic", "PathAlignCritic", "PathFollowCritic",
        "PathAngleCritic", "PreferForwardCritic"]
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 1.4
      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0
        threshold_to_consider: 0.5
      PreferForwardCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 0.5
      CostCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.81
        near_collision_cost: 253
        critical_cost: 300.0
        # KEPT stock `false`, which makes controller_server log once at startup:
        #   "Inconsistent configuration in collision checking. Please verify the
        #    robot's shape settings in both the costmap and the cost critic."
        # That warning is triggered by DELTA 1 (a polygon footprint next to a critic
        # that checks a circle) and is accepted deliberately: the circle it falls back
        # to is the CIRCUMSCRIBED one (0.383 m for our 0.70 x 0.31 box), i.e. the
        # conservative direction, and the aisle this app drives has 1.35-2.80 m of
        # free-space clearance (measured on ../maps/*.png). Turning it on costs a
        # footprint collision check per trajectory point per MPPI sample. Revisit when
        # a mission actually drives a tight gap.
        consider_footprint: false
        collision_cost: 1000000.0
        near_goal_distance: 1.0
        trajectory_point_step: 2
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 14.0
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 4
        threshold_to_consider: 0.5
        offset_from_furthest: 20
        use_path_orientations: false
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        offset_from_furthest: 5
        threshold_to_consider: 1.4
      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.0
        offset_from_furthest: 4
        threshold_to_consider: 0.5
        max_angle_to_furthest: 1.0
        mode: 0
      # TwirlingCritic:
      #   enabled: true
      #   twirling_cost_power: 1
      #   twirling_cost_weight: 10.0

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      # go2 DELTA (see file header): stock `robot_radius: 0.22` -> Go2 body box
      # 0.70 m (x) x 0.31 m (y), centred on base_link. STILL UNMEASURED: nobody has
      # measured the standing body box on this robot, so this stays the published body
      # size. It is conservative for planning (the real standing footprint is not
      # larger).
      footprint: "[[0.35, 0.155], [0.35, -0.155], [-0.35, -0.155], [-0.35, 0.155]]"
      plugins: ["voxel_layer", "inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.70
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: True
        publish_voxel_map: True
        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 16
        max_obstacle_height: 2.0
        mark_threshold: 0
        observation_sources: scan
        scan:
          topic: /scan
          # go2 DELTA 10 (see header): drop returns that came off the FLOOR.
          # The lidar rides 0.15 m above base_link and base settles at ~0.28 m
          # (measured), so the scan plane is ~0.43 m up; when the body pitches 0.1 rad
          # the beam reaches the floor ~4.3 m ahead and paints a phantom wall
          # (measured). Those returns arrive at z ~ 0, real obstacles at z ~ 0.43, so a
          # height gate separates them cleanly. 0.15 is not a new number: it is the
          # threshold stock already uses for the same purpose in collision_monitor's
          # scan source at the bottom of this file.
          min_obstacle_height: 0.15
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      always_send_full_costmap: True

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      # go2 DELTA (see file header): stock `robot_radius: 0.22` -> Go2 body box
      # 0.70 m (x) x 0.31 m (y), centred on base_link. STILL UNMEASURED: nobody has
      # measured the standing body box on this robot, so this stays the published body
      # size. It is conservative for planning (the real standing footprint is not
      # larger).
      footprint: "[[0.35, 0.155], [0.35, -0.155], [-0.35, -0.155], [-0.35, 0.155]]"
      resolution: 0.05
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          min_obstacle_height: 0.15   # go2 DELTA 10 — same floor-return gate as the local costmap above
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.7
      always_send_full_costmap: True

# The yaml_filename does not need to be specified since it going to be set by defaults in launch.
# If you'd rather set it in the yaml, remove the default "map" value in the tb3_simulation_launch.py
# file & provide full path to map below. If CLI map configuration or launch default is provided, that will be used.
# map_server:
#   ros__parameters:
#     yaml_filename: ""

map_saver:
  ros__parameters:
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: True

planner_server:
  ros__parameters:
    expected_planner_frequency: 20.0
    planner_plugins: ["GridBased"]
    costmap_update_timeout: 1.0
    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.5
      use_astar: false
      allow_unknown: true

smoother_server:
  ros__parameters:
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True

behavior_server:
  ros__parameters:
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
    wait:
      plugin: "nav2_behaviors::Wait"
    assisted_teleop:
      plugin: "nav2_behaviors::AssistedTeleop"
    local_frame: odom
    global_frame: map
    robot_base_frame: base_link
    transform_tolerance: 0.1
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2

waypoint_follower:
  ros__parameters:
    loop_rate: 20
    stop_on_failure: false
    action_server_result_timeout: 900.0
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200

route_server:
  ros__parameters:
    # The graph_filepath does not need to be specified since it going to be set by defaults in launch.
    # If you'd rather set it in the yaml, remove the default "graph" value in the launch file(s).
    # file & provide full path to map below. If graph config or launch default is provided, it is used
    # graph_filepath: $(find-pkg-share nav2_route)/graphs/aws_graph.geojson
    boundary_radius_to_achieve_node: 1.0
    radius_to_achieve_node: 2.0
    smooth_corners: true
    operations: ["AdjustSpeedLimit", "ReroutingService", "CollisionMonitor"]
    ReroutingService:
      plugin: "nav2_route::ReroutingService"
    AdjustSpeedLimit:
      plugin: "nav2_route::AdjustSpeedLimit"
    CollisionMonitor:
      plugin: "nav2_route::CollisionMonitor"
      max_collision_dist: 3.0
    edge_cost_functions: ["DistanceScorer", "CostmapScorer"]
    DistanceScorer:
      plugin: "nav2_route::DistanceScorer"
    CostmapScorer:
      plugin: "nav2_route::CostmapScorer"

velocity_smoother:
  ros__parameters:
    smoothing_frequency: 20.0
    stamp_smoothed_velocity_with_smoothing_time: False
    scale_velocities: False
    feedback: "OPEN_LOOP"
    # go2 DELTA 7 (see header): [vx, vy, wz] — wz 2.0 -> 0.8, matching MPPI's wz_max.
    # This is the last SHAPING stage before the collision gate, and every autonomy
    # source passes through it (controller AND recovery behaviours are remapped to
    # cmd_vel_nav in the pinned nav2_bringup launch), so it is the one place that can
    # promise the robot never gets a turn rate it was never measured executing.
    # Downstream of the gate, twist_mux arbitrates autonomy against teleop onto /cmd_vel.
    max_velocity: [0.5, 0.0, 0.8]
    min_velocity: [-0.5, 0.0, -0.8]
    max_accel: [2.5, 0.0, 3.2]
    max_decel: [-2.5, 0.0, -3.2]
    odom_topic: "odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0

collision_monitor:
  ros__parameters:
    # go2 DELTA 3 (see header): same frame repair as amcl. This node gates every
    # autonomy command the robot ever receives, so a base frame nothing publishes does
    # not degrade gracefully — it stops the robot with no obvious cause.
    base_frame_id: "base_link"
    odom_frame_id: "odom"
    cmd_vel_in_topic: "cmd_vel_smoothed"
    # go2 DELTA 12 (see header): stock "cmd_vel" -> "cmd_vel_autonomy".
    # NOT "cmd_vel", because twist_mux owns that name now: it arbitrates this stack
    # against a teleop source and is the only publisher the robot listens to
    # (../params/twist_mux.yaml).
    # NOT "cmd_vel_nav" either, and that one is a trap worth spelling out: the pinned
    # nav2_bringup navigation_launch.py remaps cmd_vel -> cmd_vel_nav on
    # controller_server, behavior_server AND velocity_smoother's INPUT, in both the
    # composed and the plain bring-up (verified in the pinned deb). Publishing the
    # collision monitor's OUTPUT there would feed the smoother its own gated output —
    # a loop, not a chain.
    cmd_vel_out_topic: "cmd_vel_autonomy"
    state_topic: "collision_monitor_state"
    transform_tolerance: 0.2
    source_timeout: 1.0
    base_shift_correction: True
    stop_pub_timeout: 2.0
    # Polygons represent zone around the robot for "stop", "slowdown" and "limit" action types,
    # and robot footprint for "approach" action type.
    polygons: ["FootprintApproach"]
    FootprintApproach:
      type: "polygon"
      action_type: "approach"
      footprint_topic: "/local_costmap/published_footprint"
      time_before_collision: 1.2
      simulation_time_step: 0.1
      min_points: 6
      visualize: False
      enabled: True
    observation_sources: ["scan"]
    scan:
      type: "scan"
      topic: "scan"
      min_height: 0.15
      max_height: 2.0
      enabled: True

docking_server:
  ros__parameters:
    controller_frequency: 50.0
    initial_perception_timeout: 5.0
    wait_charge_timeout: 5.0
    dock_approach_timeout: 30.0
    undock_linear_tolerance: 0.05
    undock_angular_tolerance: 0.1
    max_retries: 3
    base_frame: "base_link"
    fixed_frame: "odom"
    dock_backwards: false
    dock_prestaging_tolerance: 0.5

    # Types of docks
    dock_plugins: ['simple_charging_dock']
    simple_charging_dock:
      plugin: 'opennav_docking::SimpleChargingDock'
      docking_threshold: 0.05
      staging_x_offset: -0.7
      use_external_detection_pose: true
      use_battery_status: false # true
      use_stall_detection: false # true

      external_detection_timeout: 1.0
      external_detection_translation_x: -0.18
      external_detection_translation_y: 0.0
      external_detection_rotation_roll: -1.57
      external_detection_rotation_pitch: -1.57
      external_detection_rotation_yaw: 0.0
      filter_coef: 0.1

    # Dock instances
    # The following example illustrates configuring dock instances.
    # docks: ['home_dock']  # Input your docks here
    # home_dock:
    #   type: 'simple_charging_dock'
    #   frame: map
    #   pose: [0.0, 0.0, 0.0]

    controller:
      k_phi: 3.0
      k_delta: 2.0
      v_linear_min: 0.15
      v_linear_max: 0.15
      use_collision_detection: true
      costmap_topic: "local_costmap/costmap_raw"
      footprint_topic: "local_costmap/published_footprint"
      transform_tolerance: 0.1
      projection_time: 5.0
      simulation_step: 0.1
      dock_collision_threshold: 0.3

loopback_simulator:
  ros__parameters:
    base_frame_id: "base_footprint"
    odom_frame_id: "odom"
    map_frame_id: "map"
    scan_frame_id: "base_scan"  # tb4_loopback_simulator.launch.py remaps to 'rplidar_link'
    update_duration: 0.02
    scan_range_min: 0.05
    scan_range_max: 30.0
    scan_angle_min: -3.1415
    scan_angle_max: 3.1415
    scan_angle_increment: 0.02617
    scan_use_inf: true
