# go2_tb_fail_fixture.yaml — the INTENTIONAL-FAIL patrol fixture (U3, budget re-measured U3c).
#
# ⚠ THIS DOCUMENT IS SUPPOSED TO FAIL. It is `go2_tb_patrol_chair.yaml` with the sim-time
# mission budget cut from 180 s to 4 s — less than half the walk to the target takes — so
# the robot is still on its patrol route when the platform cancels the goal.
#
# EXPECTED, and MEASURED on the GPU host with this exact budget (U3c, `cv-infra run`,
# runner prod-0ffd7a2 — job u3c-fail-fixture-4s):
#   exit code   1
#   verdict     timeout            (the budget expired mid-mission; not "fail")
#   reached_goal   False  "closest approach 2.121 m never within tolerance 1.000 m
#                          (elapsed_sim=4.03s)"                     <- 1.12 m of margin
#   hold_near_goal False  "801 sample(s) in the last 4.00s; worst xy distance 3.236 m"
#   no_collision   True   "no robot collisions"
#   upright        True   "worst |roll| 0.039, |pitch| 0.074"
# The two criteria that must NOT fire (collision, attitude) stay green: a negative control
# that fails on everything at once controls nothing.
#
# What it is FOR (the carter fixture has the same thing —
# cv-infra-user/scenarios/nova_carter_warehouse_obstacle_fail.yaml):
#   * it proves the pipeline can say NO. A verification harness that has never produced a
#     red result on purpose has not been shown to be able to;
#   * it is the fastest possible check that a fresh deployment is wired end to end
#     (`cv-infra run` this, expect exit 1);
#   * it is the negative control for the two custom oracles: the same criteria that pass
#     in the chair document must fail here, for the RIGHT reason (read the per-criterion
#     detail strings in result.json, not just the verdict).
#
# ⚠ IT IS DELIBERATELY NOT IN THE CI SHIPPING LIST (.github/workflows/verify.yml): staging
# it would turn every PR red by design. Same call, same reason, as the carter fixture's
# intentional-fail scenario. Run it by hand:
#   cv-infra run scenarios/go2_tb_fail_fixture.yaml --runner-image <runner>; echo $?   # 1
#
# Everything not commented here is identical to go2_tb_patrol_chair.yaml — read that file
# for the mission story and the provenance of every coordinate.

apiVersion: cv-infra/v1

scenario:
  scene: go2_warehouse
  robot: go2
  initial_pose:                          # STATIC here, unlike the chair document: a fixture
    x: -6.0                              #   whose job is to fail must fail for one reason
    y: -1.0                              #   only, so no axis is randomized.
    yaw: 1.5708
  goal:
    x: -6.0                              # the same verdict anchor as the chair document
    y: 3.2
    yaw: 1.5708
    frame: map
  seed: 42
  timeout_s: 4                           # ⚠ THE FAILURE, and the number is MEASURED — TWICE,
                                         #   because the first measurement was taken in the wrong
                                         #   world. Read this before touching it.
                                         #
                                         # ── What this fixture's OWN product-path run measured
                                         # (env-3ab0b1f81692; distance to the goal keyed on /clock
                                         # out of its mcap — the oracle's ground truth trails this
                                         # AMCL belief by ~0.2 m):
                                         #   sim_t  0.2  2.0  4.0  5.0  6.0  7.0
                                         #   d_goal 2.80 2.50 1.67 1.52 1.31 0.95
                                         # `reached_goal` fired at 7.58 s. The mission is ~7.6 s
                                         # here, NOT the 18 s this header first assumed from U3's
                                         # dev-world run — for two structural reasons: (a) the
                                         # locomotion policy's activation transient walks the robot
                                         # ~1.4 m up the aisle BEFORE the platform starts the
                                         # clock, so the mission BEGINS 2.80 m from the goal, not
                                         # 4.2 m; (b) the target is confirmed immediately, so there
                                         # is no search leg to pay for.
                                         #   ⇒ at 8 s the margin was 0.42 s and the fixture was
                                         #   already failing for a DIFFERENT reason than the one
                                         #   written above (C4c §6-2 measured: `reached_goal`
                                         #   PASSED at 7.58 s; only `hold_near_goal` failed).
                                         #
                                         # ── Why 4 s, and not "a bit under 7.6 s": at the cut the
                                         # robot is ~1.85 m (GT) from the goal, so passing
                                         # `reached_goal(1.0)` would need 1.8 m in 4 s from a
                                         # standing start = 0.45 m/s AVERAGE against this SUT's own
                                         # 0.5 m/s ceiling (velocity_smoother max_velocity) and its
                                         # measured ~2 s acceleration ramp. The fixture then fails
                                         # STRUCTURALLY instead of by a margin the next tuning round
                                         # can eat. `hold_near_goal`'s 4 s window covers the whole
                                         # mission and never comes within 1.0 m, so BOTH documented
                                         # criteria fail — which is the point of a negative control.
                                         #   ⚠ An earlier draft said 25 s; that would have let the
                                         #   mission FINISH and the "fail fixture" would have
                                         #   passed. Fixtures need measurements too — and they need
                                         #   RE-measuring whenever the SUT's mission changes.
  obstacles:
    - asset: chair
      count: 1
      x: -6.0
      y: 5.2
      yaw: -1.5708                       # still facing the robot: the fixture must fail on
                                         #   TIME, not because the target was unrecognisable.
                                         # no distractors: one variable, one failure.

execution_settings:
  fixed_dt: 0.005                        # no `repeats`/`min_pass_ratio`: one sample, one verdict

sut:                                     # see go2_t0_smoke.yaml for the provenance note — ONE tag
  image_ref: go2-sut:local               #   for all five documents (U3c), built from robot_sw/.
  locomotion_policy:
    file: policy.pt
    sha256: 73338e49c3f1932bbcb9cf54e97ef71a9cac24bb2bb214217aa8b592cb9442fd

interface:                               # identical to the chair document
  type: ros2
  adapter_config:
    ros_distro: jazzy
    rmw: rmw_fastrtps_cpp
    use_sim_time: true
    goal_interface:
      kind: action
      name: /navigate_to_pose
      type: nav2_msgs/action/NavigateToPose
    cmd_vel:
      topic: /cmd_vel
      type: geometry_msgs/msg/Twist
    clock_topic: /clock
    odom_topics:
      - /odom
    sensors:
      - topic: /camera/image_raw
        type: sensor_msgs/msg/Image
      - topic: /camera/depth/image_raw
        type: sensor_msgs/msg/Image
      - topic: /camera/camera_info
        type: sensor_msgs/msg/CameraInfo
      - topic: /scan
        type: sensor_msgs/msg/LaserScan
    frames:
      map: map
      odom: odom
      base_link: base_link
    readiness:
      is_active_service: /lifecycle_manager_navigation/is_active

acceptance_criteria:                     # identical to the chair document — that is the point:
  - oracle: reached_goal                 #   the criteria are not what makes this fail.
    params:
      position_tolerance_m: 1.0
  - oracle: no_collision
    params:
      chassis_path: /World/Go2/base
      collision_scope: robot             # AR-25 — same as the chair document (rationale in
                                         #   go2_t0_smoke.yaml). The criteria must stay identical
                                         #   to it: what makes this fixture fail is the budget.
      collision_excluded_paths:
        - /World/GroundPlane/collisionPlane
        - /World/Warehouse_Empty_small_realtime/GroundPlane/CollisionPlane
  - oracle: "hold_near_goal:HoldNearGoalOracle"
    params:
      hold_radius_m: 1.0
      hold_duration_s: 4.0
  - oracle: "upright:UprightOracle"
    params:
      max_roll_rad: 0.5
      max_pitch_rad: 0.5
