# go2_tb_patrol_chair.yaml — the Go2 consumer's PATROL request, target = chair (U3).
#
# The story: "patrol the aisle until you find the chair, walk up to it, and keep it in
# view long enough to be sure." Three samples with a randomized start and a randomized
# set of distractor props; the request passes if at least two of the three do.
#
# This is the scenario that makes the go2 consumer a DIFFERENT mission from the carter
# fixture rather than a second robot doing the same errand. What changes is the SUT's
# behaviour and the acceptance criteria; what does NOT change is the platform contract:
# the same `interface.goal_interface` (nav2_msgs/action/NavigateToPose @
# /navigate_to_pose), now SERVED BY `go2_patrol_manager` with nav2 remapped behind it
# (decision 2026-08-31 D4). The platform sends the goal it always sent.
#
# ── What the goal means here (read this before changing a coordinate) ─────────────
# The goal is the VERDICT ANCHOR, not a hint: it is the STANDOFF POINT 2.0 m in front of
# the chair, i.e. where a robot that actually found the chair ends up. The SUT does NOT
# use it to search — it walks its own patrol route (a `go2_patrol_manager` parameter, like
# a real patrol robot's route) and finds the chair with the camera. That is why the route
# deliberately stays >= 2.0 m away from this goal: a run whose perception is dead walks the
# route and FAILS `reached_goal`, instead of coasting to a pass.
#
# ── ★ Why 2.0 m and not the 0.8 m the plan first assumed (MEASURED, U3 §6-2) ──────
# The first version of this document put the goal 0.8 m from the chair, reasoning from
# optics: a 0.877 m chair at ~1 m is whole and large in a 640x480 frame with fy = 366.5.
# The live run FAILED — the robot arrived and the hold condition could never be met. So we
# measured the actual detector against the actual asset, one frame per sim second while
# walking in:
#
#   distance    5.5   4.6   4.1   3.2   2.7   2.5   2.2   1.7   1.3   <=1.2
#   chair conf  0.19  0.76  0.36  0.84  0.83  0.87  0.79  0.84  0.46  0.10-0.38
#
# Below ~1.3 m the frame-filling chair is read as `bench`, not `chair` — the AR-24 failure
# mode, now quantified as a DISTANCE band rather than a framing anecdote. The working band
# is ~1.7-3.2 m, the app's standoff sits in the middle of it (2.0 m), and this goal is that
# same point. Geometry proposed; measurement disposed.
#
# ── The chair's pose is geometry, not taste (AR-9, MEASURED) ─────────────────────
# yaw = -pi/2 turns the chair's front (+X in its own frame) toward -Y = toward the
# approaching robot. YOLO reads SM_Chair as `chair 0.834` from the front and as NOTHING
# (`bus 0.599`) from behind (platform C0 §6-5, four renders).
#
# ── Every coordinate is computed from this repo's own vendored map ────────────────
# Free-space clearance (trinary thresholds + distance transform over
# ../robot_sw/src/go2_bringup/maps/carter_warehouse_navigation.png):
#   start (-6.0, -1.0) 1.32 m · route (-5.5, 0.8) 3.30 m / (-6.0, 1.2) 2.80 m ·
#   goal (-6.0, 3.2) 2.80 m · chair (-6.0, 5.2) 2.70 m · distractor window >= 4.3 m.

apiVersion: cv-infra/v1

scenario:
  scene: go2_warehouse                   # same world as T0/TA (D-1) — only the mission changes
  robot: go2
  initial_pose:                          # 3 axes, uniform — the T0 pose +- the window U1 uses
    x: {uniform: [-6.3, -5.7]}           #   (carter's live-proven +-0.3 m / +-0.15 rad). Worst
    y: {uniform: [-1.3, -0.7]}           #   corner still has 1.02 m of map clearance against a
    yaw: {uniform: [1.4208, 1.7208]}     #   0.383 m robot half-diagonal.
                                         # yaw ~ pi/2 = already facing up the aisle: this SUT
                                         #   must never be asked to pivot in place (AR-16 ①).
  goal:
    x: -6.0                              # 2.0 m in front of the chair = where a robot that
    y: 3.2                               #   found it stands (measured band, see header).
    yaw: 1.5708                          #   NOT sent as a search hint; the SUT's manager
    frame: map                           #   only uses it to know the mission started.
                                         # yaw is sent to the app but NOT judged (no
                                         #   `goal_orientation_wxyz` below).
  seed: 42                               # same seed + same document = the same three samples
  timeout_s: 180                         # SIM-time budget. The measured mission (dev-world,
                                         #   U3 report §6-3) is **18 s** (chair) / 16 s
                                         #   (person): ~3.5 m of walking + the approach + the
                                         #   5 s confirmation hold. 180 s leaves 10x for AMCL
                                         #   settling and a recovery round, and bounds a stuck
                                         #   sample (RTF measured 0.91, so ~200 s of wall).
  obstacles:
    # ── the TARGET (static: randomized targets are backlog B-2) ──────────────────
    - asset: chair                       # platform registry name -> SM_Chair.usd, W0-measured
      count: 1                           #   bbox 0.600 x 0.599 x 0.877 m, z_offset 0.0
      x: -6.0                            # dead centre of the aisle, 0.8 m beyond the goal
      y: 5.2
      yaw: -1.5708                       # front (+X) faces -Y = faces the approaching robot
    # ── distractors: things the detector WILL see and must not chase ─────────────
    # Both are off-course by construction: the robot's corridor (start window + the ~0.97 m
    # policy transient + the route + the standoff) is x[-6.45, -5.15], and these sit at
    # x <= -2.5 / >= -3.5, i.e. >= 1.65 m of centre separation before their own footprint. Neither is
    # in the tracker's `target_classes`, so a desk read as `dining table` cannot become a
    # target — but they do exercise the discrimination, which the crates in TA cannot
    # (those sit BELOW the Go2's 0.43 m scan plane and are invisible to the SUT).
    - asset: box                         # runner's built-in cuboid (1.2 x 0.4 x 0.15 m)
      count: {randint: [0, 2]}
      x: {uniform: [-3.5, -2.5]}
      y: {uniform: [1.0, 2.0]}
    - asset: desk                        # SM_SecretaryDeskA, 0.800 x 2.800 x 0.750 m
      count: {randint: [0, 1]}           # yaw omitted = static 0.0 -> its 2.8 m axis stays
      x: {uniform: [-3.5, -2.5]}         #   along y, never swinging into the aisle
      y: {uniform: [3.0, 4.0]}

execution_settings:
  repeats: 3                             # = sample count (p6 B-U semantics)
  min_pass_ratio: 0.67                   # 2/3 -> the request passes
  fixed_dt: 0.005                        # the policy's TRAINING condition (A4/D-4), as T0/TA

sut:                                     # SUT = {image, locomotion policy} (D2) — see
  image_ref: go2-sut:u3                  #   go2_t0_smoke.yaml for the full provenance note.
  locomotion_policy:                     # CI injects the PR's image over `image_ref`; this is
    file: policy.pt                      #   the standalone default.
    sha256: 73338e49c3f1932bbcb9cf54e97ef71a9cac24bb2bb214217aa8b592cb9442fd

interface:
  type: ros2
  adapter_config:
    ros_distro: jazzy
    rmw: rmw_fastrtps_cpp
    use_sim_time: true
    goal_interface:                      # UNCHANGED from the nav scenarios. The server behind
      kind: action                       #   this name is now go2_patrol_manager, and nav2's own
      name: /navigate_to_pose            #   action lives at /nav2/navigate_to_pose inside the
      type: nav2_msgs/action/NavigateToPose  #   SUT (D4). The platform cannot tell, by design.
    cmd_vel:
      topic: /cmd_vel                    # still nav2's collision_monitor: the patrol manager
      type: geometry_msgs/msg/Twist      #   never publishes a velocity itself.
    clock_topic: /clock
    odom_topics:
      - /odom
    sensors:                             # ⚠ DECLARING a sensor is what makes the runner publish
      - topic: /camera/image_raw         #   it (C3 §2). THIS is the line that turns the patrol
        type: sensor_msgs/msg/Image      #   on: without the camera the SUT has no perception
      - topic: /camera/depth/image_raw   #   and its manager falls back to plain navigation.
        type: sensor_msgs/msg/Image      # depth: 32FC1, identified by the `depth` path segment
      - topic: /camera/camera_info       # intrinsics the tracker back-projects with
        type: sensor_msgs/msg/CameraInfo #   (k = [366.4996, 0, 320, 0, 366.4997, 240], 640x480)
      - topic: /scan                     # unchanged from T0: 3200 beams, 360 deg, 10 Hz
        type: sensor_msgs/msg/LaserScan
    frames:
      map: map
      odom: odom
      base_link: base_link
    readiness:
      is_active_service: /lifecycle_manager_navigation/is_active

acceptance_criteria:
  - oracle: reached_goal                 # built-in: did the robot ever get to the standoff?
    params:
      position_tolerance_m: 1.0          # unchanged from T0/TA: 0.50 (the SUT's own
                                         #   xy_goal_tolerance) + 0.39 (measured AMCL belief
                                         #   error at the goal) = 0.89, rounded up.
  - oracle: no_collision                 # built-in: and it did so without touching anything
    params:
      chassis_path: /World/Go2/base      # the subtree anchor the reduction walks down from
      collision_scope: robot             # AR-25 — declared, not assumed: leg<->chair contact
                                         #   COUNTS, which is what "collided" means for a
                                         #   quadruped that touches the world with its feet.
                                         #   The default "chassis" scope would see none of it
                                         #   (rationale in go2_t0_smoke.yaml).
      collision_excluded_paths:          # ONLY the floor (two prims, different spellings —
        - /World/GroundPlane/collisionPlane                                  # C1 §2 verbatim).
        - /World/Warehouse_Empty_small_realtime/GroundPlane/CollisionPlane
                                         # ⚠ `/World/cv_obstacles` is deliberately NOT excluded:
                                         #   the chair is the TARGET, and walking into your
                                         #   target is a failed patrol, not a successful one.
  - oracle: "hold_near_goal:HoldNearGoalOracle"   # custom (this dir) — "still there at the end"
    params:
      hold_radius_m: 1.0
      # WHERE 1.0 COMES FROM: the app stops ON this goal (its 2.0 m standoff ring IS this
      # point), so the only term left is the SUT's own stopping error — bounded by 0.89 m
      # (0.50 declared xy_goal_tolerance + 0.39 measured AMCL belief error, U1 §6-2) and
      # MEASURED at 0.082 m (chair) / 0.042 m (person) in the live dev-world runs — and
      # that is the WORST sample of the whole 4 s window, not just the final one.
      # 1.0 is the round number above the bound, and it is the same number `reached_goal`
      # uses: the two oracles then differ only in WHAT they ask (touched once vs still
      # there at the end), which is the point of having both.
      # A run that never approaches is still caught: the patrol route's closest waypoint is
      # 2.0 m from here.
      hold_duration_s: 4.0
      # < the app's own 5.0 s confirmation hold, so the window sits INSIDE the hold with a
      # second of margin for sample spacing. Raising this above 5.0 would be judging the
      # approach, not the hold.
  - oracle: "upright:UprightOracle"      # custom (this dir) — the quadruped never fell over
    params:
      max_roll_rad: 0.5                  # ~14x the measured walking attitude (roll 0.011 /
      max_pitch_rad: 0.5                 #   pitch 0.035 rad, C3 §4-2) and far below a fall
                                         #   (a Go2 that sat down measured roll -0.216, C1 §3).
                                         #   Live dev-world patrol runs (3045 + 1229 GT
                                         #   samples): worst |roll| 0.087, worst |pitch| 0.099.
