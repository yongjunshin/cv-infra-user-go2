# go2_ta_nav_random.yaml — the Go2 consumer's RANDOMIZED navigation request (U1).
#
# The story: the same aisle mission as go2_t0_smoke.yaml, but the robot does not start
# from the same spot twice, the goal is one of two points up the aisle, and the floor
# may or may not have crates on it. Five samples; the request passes if at least four do.
#
# One platform document -> five CONCRETE samples (`derivation: {version, index}` stamped
# by the platform, never by us). The notation is the platform's (M1/p6):
#   `value` = static  ·  {uniform: [lo, hi]}  ·  {choice: [...]}  ·  {randint: [lo, hi]}
# `randint` is the COUNT axis only. Static axes consume no draw, so the numbers below
# stay stable when an axis is added later.
#
# ⚠ STATUS — NOT YET RUN LIVE. This document is authored from the T0 route and the
# platform's measurements; the live TA run is the platform's C5/C4 gate (batch repose
# for a quadruped lands in C5, which is what gates TA at all — master plan D-5). So
# "pass-proven" is claimed for T0's route only, NOT for these windows. Whoever runs it
# first should record the sample distribution before this file is called a gate.
#
# ── Windows: every bound is computed or measured, none is typed ──────────────────
# * initial_pose = the T0 pose +- the same half-window the carter consumer's live-proven
#   random scenario uses (+-0.3 m, +-0.15 rad). Why not wider: the axis under test here
#   is "does the same mission survive a different start", and a wide window would mostly
#   test map geometry. Worst corner of the window has 0.95 m of free-space clearance
#   (computed from ../robot_sw/src/go2_bringup/maps/*.png) against a 0.383 m robot
#   half-diagonal.
# * The policy-activation transient (~0.97 m along the heading, C2b §6-2 + U1 live) is
#   INSIDE the error budget: with yaw = pi/2 +- 0.15 it lands the robot in
#   x[-6.45,-5.55], y[-0.4,0.3], whose worst clearance is 1.85 m.
# * ⚠ KNOWN RISK, NOT YET MEASURED FOR THIS FILE: the SUT's AMCL prior
#   (nav2_params.yaml DELTA 5) is seeded at the pose the robot SETTLES at, because on
#   the single-run path nobody tells it otherwise. On the BATCH path the platform
#   publishes /initialpose per sample with that sample's DECLARED pose and then settles
#   — so the transient happens AFTER the seed and every sample starts ~0.97 m behind its
#   own belief. U1 measured what that costs on the single-run path before the seed was
#   fixed: the mission still succeeded and GT still passed within 0.02 m of the goal,
#   but it took 6 recovery rounds and ~75 s of extra sim time. Whether realign should
#   seed after the settle is the platform's call, not this document's.
# * goal.y = {4.0, 5.0}: two points on the SAME straight lane as T0 (5.0 is T0's own
#   goal), clearance 2.7 / 2.8 m. `choice` draws per axis, so keeping it on ONE axis
#   means exactly two goals, not a cross product.
# * obstacles = OFF the course, on purpose. Course (conservative rectangle around the
#   start window, the transient and both goals) = x[-6.45,-5.55] x y[-1.3,5.0]. The box
#   window x[-3.5,-2.5] x y[1.0,4.0] is >= 2.05 m from that rectangle's edge; minus the
#   built-in box's worst-case half-diagonal (1.2 x 0.4 m -> 0.633 m) that is **>= 1.42 m
#   of surface separation** at any yaw. Inside the window the map's own free-space
#   clearance is >= 4.18 m, so a crate can never be spawned inside a rack.
#
# ── Honest limit of the obstacle axis for THIS robot ─────────────────────────────
# The built-in box is 0.15 m tall (runner-owned default) and the Go2's scan plane sits
# ~0.43 m above the floor (lidar 0.15 m above a base that settles at ~0.28 m — C1/C3
# measured). So these crates are BELOW the beam: they are physically there (and would
# trip the robot if it walked into one), but the SUT never sees them. This axis
# therefore exercises the platform's obstacle derivation + the physical stage, NOT the
# SUT's perception. That is the opposite of the carter fixture's obstacle scenario,
# where map-absent furniture WAS visible and poisoned AMCL — a difference worth knowing
# before reading a green result here as "obstacles are handled". A perception-visible
# obstacle axis belongs to the TB patrol scenarios (U3), where the assets are chosen
# for exactly that.

apiVersion: cv-infra/v1

scenario:
  scene: go2_warehouse
  robot: go2
  initial_pose:                          # 3 axes, uniform — the T0 pose +- the carter fixture's window
    x: {uniform: [-6.3, -5.7]}
    y: {uniform: [-1.3, -0.7]}
    yaw: {uniform: [1.4208, 1.7208]}     # pi/2 +- 0.15 rad (~+-8.6 deg): still facing the goal (AR-16 ①)
  goal:
    x: -6.0                              # static: one axis of the goal moves, so the signal stays readable
    y: {choice: [4.0, 5.0]}              # 5.0 = T0's goal; 4.0 = 1 m short, same lane (clearance 2.8 m)
    yaw: 1.5708                          # sent to nav2; not judged (no goal_orientation_wxyz below)
    frame: map
  seed: 42                               # same seed + same document = the same five samples
  timeout_s: 180                         # unchanged from T0 (the route is the same length or shorter)
  obstacles:
    - asset: box                         # the platform's built-in cuboid (1.2 x 0.4 x 0.15 m defaults)
      count: {randint: [0, 3]}           # 0..3 inclusive — some samples get no crates at all, by design
      x: {uniform: [-3.5, -2.5]}         # off-course open area east of the aisle (see header for the
      y: {uniform: [1.0, 4.0]}           #   separation arithmetic). yaw omitted = static 0.0, no draw.

execution_settings:
  repeats: 5                             # = sample count (p6 B-U semantics)
  min_pass_ratio: 0.8                    # 4/5 -> the request passes (omitting this means any-fail)
  fixed_dt: 0.005                        # identical to T0 — the policy's training condition (A4/D-4)

sut:                                     # identical to T0 — see go2_t0_smoke.yaml for provenance.
  image_ref: go2-sut:u1-dev              # CI injects the PR's image; this is the standalone default.
  locomotion_policy:
    file: policy.pt
    sha256: 73338e49c3f1932bbcb9cf54e97ef71a9cac24bb2bb214217aa8b592cb9442fd

interface:                               # identical to T0 (C3 §2 measured inventory) — the interface is
  type: ros2                             #   not what this document varies.
  adapter_config:
    ros_distro: jazzy
    rmw: rmw_fastrtps_cpp
    use_sim_time: true
    goal_interface:
      kind: action
      name: /navigate_to_pose
      type: nav2_msgs/action/NavigateToPose
    cmd_vel:
      topic: /cmd_vel
      type: geometry_msgs/msg/Twist
    clock_topic: /clock
    odom_topics:
      - /odom
    sensors:
      - topic: /scan
        type: sensor_msgs/msg/LaserScan
    frames:
      map: map
      odom: odom
      base_link: base_link
    readiness:
      is_active_service: /lifecycle_manager_navigation/is_active

acceptance_criteria:                     # identical to T0 — the verdict rule must not move with the axes
  - oracle: reached_goal
    params:
      position_tolerance_m: 1.0          # see go2_t0_smoke.yaml for the two measured terms behind it
  - oracle: no_collision
    params:
      chassis_path: /World/Go2/base      # the subtree anchor the reduction walks down from
      collision_scope: robot             # AR-25 — declared, not assumed: leg<->crate contact COUNTS.
                                         #   Drop it and the default "chassis" scope sees none of it
                                         #   (rationale in go2_t0_smoke.yaml).
      collision_excluded_paths:          # floor only — `/World/cv_obstacles` is deliberately not here,
        - /World/GroundPlane/collisionPlane                                  # because walking into a
        - /World/Warehouse_Empty_small_realtime/GroundPlane/CollisionPlane   # crate must fail.
