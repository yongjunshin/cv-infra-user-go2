name: cv-infra-go2-verify

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    permissions:
      checks: write
      pull-requests: write
      contents: read
    uses: yongjunshin/cv-infra-workspace/.github/workflows/verify.yml@main
    with:
      sim_script: verify/run
      sim_input_space: verify/space.pict
      sim_output_dir: verify/out
      oracle_script: verify/judge
      # The runtime image is built from this checkout and its local image ID is used as
      # the digest. The executable entrypoint owns all ROS/compose meaning; cv-infra
      # only supplies the PICT argv plus CASE, OUT and SEED.
      runtime_dockerfile: verify/runtime.Dockerfile
      runtime_context: .
      # Required image field; the reusable workflow replaces it with the locally-built
      # runtime image ID before invoking cv-infra.
      sim_image: docker:27.5.1-cli@sha256:851f91d241214e7c6db86513b270d58776379aacc5eb9c4a87e5b47115e3065c
      pict_k: 2
      repeats: 1
      concurrency: 1
      budget: 10800
