# Consumer verify.yml — the whole integration surface this repository maintains.
#
# One job, one `uses:`. Everything cv-infra needs is in the `with:` block below: the
# executable entrypoint to run per case, the input space to expand into cases, the
# directory that entrypoint writes into (collected and zipped per case), the image the
# case runs in, and the script that turns the output into a verdict. The platform is
# consumed as a contract + a workflow ref ONLY.
#
# The called workflow runs on the self-hosted GPU workstation and posts the result back
# onto this PR as a Check Run + a sticky comment + artifacts.
#
# ⚠ `sim_image` IS THIS REPOSITORY'S OWN IMAGE, not the stock Isaac one. cv-infra starts
# exactly ONE container per case, so the simulator and the ROS 2 app have to live in the
# same image: verify/Dockerfile bakes robot_sw/ on top of the pinned Isaac Sim 5.1.0
# digest. sim/patrol_world.py and the locomotion policy are NOT baked — they are read
# from the read-only checkout at run time.
#
# THEREFORE: changing anything under robot_sw/ means rebuild -> push -> re-pin the digest
# below, IN THE SAME PR. The image is the app; a PR that edits a node and leaves the
# digest alone verifies the OLD app and says nothing about the diff. The build and pin
# commands are in ../../README.md §cv-infra 검증.
#
# PIN (env reproducibility): `@main` is the platform's stable ref until a release tag
# exists. MOVE IT TO THE TAG the moment one does — a branch ref can change underneath us,
# which is exactly what a pin prevents.
#
# SECURITY: the plain `pull_request` trigger only, never its privileged base-context
# variant — executing fork-PR head code with base secrets on a self-hosted GPU box is an
# RCE pattern. A fork PR consequently needs a maintainer's approval before it can reach
# the runner.

name: cv-infra-go2-verify

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    # Job-level `uses:` — this job carries no `runs-on`/`steps` of its own; the called
    # workflow is the definition.
    permissions:
      checks: write # post the Check Run
      pull-requests: write # upsert the sticky comment
      contents: read
    uses: yongjunshin/cv-infra-workspace/.github/workflows/verify.yml@main
    with:
      # `verify/sim --target=... --start_x=...` — a bash entrypoint; the shebang, not the
      # platform, picks the interpreter.
      sim_script: verify/sim
      sim_input_space: verify/space.pict
      # Must exist in the checkout (that is what verify/out/.gitkeep is for): the platform
      # mounts the case's own output directory over this path, read-write.
      sim_output_dir: verify/out
      # Present = this check GATES. Remove it and the same matrix runs as a sweep.
      oracle_script: verify/oracle.py
      # REQUIRED, and a digest — the platform refuses a bare tag. Built from
      # verify/Dockerfile with the repository root as context; see the ⚠ above.
      sim_image: ghcr.io/yongjunshin/cv-infra-user-go2/go2-verify@sha256:PINNED_AFTER_FIRST_BUILD
      pict_k: 2
      repeats: 1
      # One case at a time: every container time-shares the one GPU, and an Isaac world
      # plus a nav2 stack is not a workload two of which have been measured side by side.
      concurrency: 1
      # 3 hours for 12 cases. MEASURED 2026-09-23 on etri6000, one case, COLD cache:
      # 167 s wall (/clock after 141 s incl. the asset download, app up 6 s later,
      # mission 17 s, teardown 3 s). The ceiling is the 300 s mission timeout plus a cold
      # boot, i.e. ~8 min worst case per case — 12 of those still fit with headroom.
      budget: 10800
